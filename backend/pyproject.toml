[project]
name = "prevwinds_backend"
version = "0.1.0"
description = "Prewinds backend environment"
requires-python = ">=3.10,<3.11"
dependencies = ["requests>=2,<3", "ariadne>=0,<1"]

[dependency-groups]
dev = [
  "boto3>=1,<2",
  "pip",
  "aws-sam-cli>=1,<2",
  "mypy>=1,<2",
  "pytest>=9,<10",
  "ruff>=0,<1",
  "uvicorn>=0,<1",
]
